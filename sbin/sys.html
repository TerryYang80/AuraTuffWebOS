<!DOCTYPE html>
<html lang="en">
<head>

    <title>AuraTuffWebOS</title>

    <link rel="stylesheet" href="./sys.css">

    <script src="./sys.js" defer></script>
</head>
<body>

    <div id="top-bar">
        <p style="margin-left: 1%;" class="top-bar-content">AuraTuffWebOS</p>
